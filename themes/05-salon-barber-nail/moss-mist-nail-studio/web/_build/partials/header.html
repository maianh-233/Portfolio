<header id="top" data-header="shrink" class="sticky top-0 z-40 border-b border-ink/10 bg-mist/90 backdrop-blur-md transition-shadow duration-300 [&.is-scrolled]:shadow-[0_8px_30px_-18px_rgba(31,39,29,.35)]">
  <div class="mx-auto flex h-[72px] w-full max-w-screen-2xl items-center justify-between gap-6 px-4 sm:px-6 lg:px-10 2xl:px-16">
    <a href="{{root}}index.html" class="group flex min-h-[44px] flex-col justify-center leading-none" aria-label="MOSS & MIST NAIL STUDIO, home">
      <span class="font-display text-[22px] font-semibold tracking-tight text-moss">MOSS &amp; MIST</span>
      <span class="mt-1 text-[12px] font-bold tracking-[0.3em] text-bark">NAIL STUDIO</span>
    </a>

    <nav class="hidden items-center gap-9 lg:flex" aria-label="Main">
      <a href="{{root}}index.html" class="relative py-2 text-[15px] font-medium text-ink/75 transition-colors duration-300 hover:text-moss after:absolute after:inset-x-0 after:-bottom-0.5 after:h-px after:origin-right after:scale-x-0 after:bg-moss after:transition-transform after:duration-500 after:ease-[cubic-bezier(.16,1,.3,1)] hover:after:origin-left hover:after:scale-x-100 aria-[current=page]:text-moss aria-[current=page]:after:scale-x-100">Home</a>
      <a href="{{root}}pages/services.html" class="relative py-2 text-[15px] font-medium text-ink/75 transition-colors duration-300 hover:text-moss after:absolute after:inset-x-0 after:-bottom-0.5 after:h-px after:origin-right after:scale-x-0 after:bg-moss after:transition-transform after:duration-500 after:ease-[cubic-bezier(.16,1,.3,1)] hover:after:origin-left hover:after:scale-x-100 aria-[current=page]:text-moss aria-[current=page]:after:scale-x-100">Services &amp; Pricing</a>
      <a href="{{root}}pages/collection.html" class="relative py-2 text-[15px] font-medium text-ink/75 transition-colors duration-300 hover:text-moss after:absolute after:inset-x-0 after:-bottom-0.5 after:h-px after:origin-right after:scale-x-0 after:bg-moss after:transition-transform after:duration-500 after:ease-[cubic-bezier(.16,1,.3,1)] hover:after:origin-left hover:after:scale-x-100 aria-[current=page]:text-moss aria-[current=page]:after:scale-x-100">Collection</a>
      <a href="{{root}}pages/studio.html" class="relative py-2 text-[15px] font-medium text-ink/75 transition-colors duration-300 hover:text-moss after:absolute after:inset-x-0 after:-bottom-0.5 after:h-px after:origin-right after:scale-x-0 after:bg-moss after:transition-transform after:duration-500 after:ease-[cubic-bezier(.16,1,.3,1)] hover:after:origin-left hover:after:scale-x-100 aria-[current=page]:text-moss aria-[current=page]:after:scale-x-100">Our Studio</a>
    </nav>

    <div class="flex items-center gap-3">
      <button type="button" data-modal-open="booking" class="hidden min-h-[44px] items-center rounded-full bg-moss px-6 text-[15px] font-semibold text-mist transition duration-300 hover:bg-ink active:scale-[.98] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-fern sm:inline-flex">Book a visit</button>
      <button type="button" data-menu-toggle="#mnav" aria-label="Open menu" class="inline-flex h-11 w-11 items-center justify-center rounded-full border border-ink/15 text-ink transition hover:border-moss hover:text-moss lg:hidden">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
      </button>
    </div>
  </div>

  <div id="mnav" data-menu class="fixed inset-x-4 top-20 z-50 rounded-[2rem] bg-mist p-6 shadow-2xl lg:hidden">
    <nav class="flex flex-col" aria-label="Mobile">
      <a href="{{root}}index.html" class="flex min-h-[52px] items-center border-b border-ink/10 font-display text-2xl text-ink aria-[current=page]:text-fern">Home</a>
      <a href="{{root}}pages/services.html" class="flex min-h-[52px] items-center border-b border-ink/10 font-display text-2xl text-ink aria-[current=page]:text-fern">Services &amp; Pricing</a>
      <a href="{{root}}pages/collection.html" class="flex min-h-[52px] items-center border-b border-ink/10 font-display text-2xl text-ink aria-[current=page]:text-fern">Collection</a>
      <a href="{{root}}pages/studio.html" class="flex min-h-[52px] items-center font-display text-2xl text-ink aria-[current=page]:text-fern">Our Studio</a>
      <button type="button" data-modal-open="booking" class="mt-5 inline-flex min-h-[52px] w-full items-center justify-center rounded-full bg-moss text-base font-semibold text-mist">Book a visit</button>
    </nav>
  </div>

  <dialog id="booking" class="w-[min(94vw,560px)] rounded-[2rem] bg-mist p-0 text-ink shadow-2xl">
    <div class="p-6 sm:p-9">
      <div class="flex items-start justify-between gap-4">
        <div>
          <p class="font-display text-3xl leading-tight text-moss">Book a visit</p>
          <p class="mt-2 text-[15px] text-ink/70">Tell us what you would like and when. We keep each appointment unhurried.</p>
        </div>
        <button type="button" data-modal-close aria-label="Close" class="inline-flex h-11 w-11 shrink-0 items-center justify-center rounded-full border border-ink/15 text-xl transition hover:border-moss hover:text-moss">&times;</button>
      </div>
      <form data-form="booking" class="mt-6 grid gap-4 sm:grid-cols-2" novalidate>
        <label class="grid gap-2 text-sm font-semibold text-ink">Your name
          <input type="text" name="name" required minlength="2" autocomplete="name" class="min-h-[48px] rounded-xl border border-ink/20 bg-white px-4 text-base font-normal text-ink placeholder:text-ink/50 focus:border-moss focus:outline-none focus:ring-2 focus:ring-fern/40" placeholder="Minh Chau">
        </label>
        <label class="grid gap-2 text-sm font-semibold text-ink">Phone
          <input type="tel" name="phone" required autocomplete="tel" class="min-h-[48px] rounded-xl border border-ink/20 bg-white px-4 text-base font-normal text-ink placeholder:text-ink/50 focus:border-moss focus:outline-none focus:ring-2 focus:ring-fern/40" placeholder="090 412 3876">
        </label>
        <label class="grid gap-2 text-sm font-semibold text-ink">Service
          <select name="service" required class="min-h-[48px] rounded-xl border border-ink/20 bg-white px-4 text-base font-normal text-ink focus:border-moss focus:outline-none focus:ring-2 focus:ring-fern/40">
            <option value="">Choose a service</option>
            <option>Natural Manicure</option>
            <option>Pedicure</option>
            <option>Gel Polish</option>
            <option>Nail Extensions</option>
            <option>Botanical Nail Art</option>
          </select>
        </label>
        <label class="grid gap-2 text-sm font-semibold text-ink">Preferred date
          <input type="date" name="date" required class="min-h-[48px] rounded-xl border border-ink/20 bg-white px-4 text-base font-normal text-ink focus:border-moss focus:outline-none focus:ring-2 focus:ring-fern/40">
        </label>
        <label class="grid gap-2 text-sm font-semibold text-ink sm:col-span-2">Notes (optional)
          <textarea name="note" rows="3" class="rounded-xl border border-ink/20 bg-white px-4 py-3 text-base font-normal text-ink placeholder:text-ink/50 focus:border-moss focus:outline-none focus:ring-2 focus:ring-fern/40" placeholder="A design you saved, nail length, anything we should know"></textarea>
        </label>
        <div class="flex flex-col gap-3 sm:col-span-2 sm:flex-row sm:items-center">
          <button type="submit" class="inline-flex min-h-[48px] items-center justify-center rounded-full bg-moss px-8 text-[15px] font-semibold text-mist transition duration-300 hover:bg-ink active:scale-[.98]">Request this time</button>
          <p class="text-[13px] leading-snug text-ink/65">Demo form only: no appointment is sent or confirmed.</p>
        </div>
      </form>
    </div>
  </dialog>
</header>
