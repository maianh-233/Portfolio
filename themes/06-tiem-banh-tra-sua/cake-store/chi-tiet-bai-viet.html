<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bài viết | Tiệm Bánh Kem</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/app.js"></script>
</head>
<!-- SCR-010 Chi tiết bài viết: FR-005. ?slug=<slug>. Bài nháp / ẩn / không có -> SCR-012 (E-GT-02). -->
<body data-screen="SCR-010" data-layout="public" data-nav="blog" class="bg-cream text-ink font-sans antialiased">
  <div id="app-header"></div>

  <main id="main" class="mx-auto max-w-shell px-4 md:px-6 lg:px-8 pt-5 md:pt-8">
    <nav aria-label="Đường dẫn" class="text-sm text-ink-muted">
      <ol class="flex flex-wrap items-center gap-1.5">
        <li><a href="index.html" class="hover:text-primary-strong" data-i18n="nav.home">Trang chủ</a></li>
        <li aria-hidden="true"><i class="ph ph-caret-right text-xs"></i></li>
        <li><a href="bai-viet.html" class="hover:text-primary-strong" data-i18n="nav.blog">Bài viết</a></li>
        <li aria-hidden="true"><i class="ph ph-caret-right text-xs"></i></li>
        <li id="bc" class="font-bold text-ink line-clamp-1" aria-current="page"></li>
      </ol>
    </nav>
    <article id="post" class="mt-6"></article>
    <section id="related" class="mt-16" aria-labelledby="rel-title"></section>
  </main>

  <div id="app-footer"></div>

  <script>
    App.onReady(function () {
      var slug = App.param('slug') || 'meo-giu-banh-kem-tuoi-lau';
      var post = DB.get('posts').filter(function (p) { return p.slug === slug; })[0];
      if (!post || post.status !== 'published') { location.replace('khong-tim-thay.html?type=post'); return; }

      /* Nội dung lưu dạng khối đơn giản [loại, nội dung] -> HTML (đoạn, tiêu đề phụ, danh sách) */
      function body(blocks) {
        return blocks.map(function (b) {
          if (b[0] === 'h2') return '<h2>' + Fmt.esc(b[1]) + '</h2>';
          if (b[0] === 'ul') return '<ul>' + b[1].map(function (li) { return '<li>' + Fmt.esc(li) + '</li>'; }).join('') + '</ul>';
          return '<p>' + Fmt.esc(b[1]) + '</p>';
        }).join('');
      }
      function render() {
        var title = I18n.pick(post, 'title'); /* thiếu bản EN -> dùng bản VI */
        document.title = title + ' | ' + MOCK.shop.name;
        $('#bc').textContent = title;
        $('#post').innerHTML =
          '<img src="' + post.cover + '" alt="" class="w-full aspect-[16/9] md:aspect-[21/9] object-cover rounded-3xl bg-beige">' +
          '<div class="mx-auto max-w-[720px] mt-8">' +
          '<p class="flex items-center gap-2 text-sm"><span class="badge ' + (post.category === 'news' ? 'bg-butter text-butter-strong' : 'bg-mint text-mint-strong') + '">' + I18n.t(post.category === 'news' ? 'blog.news' : 'blog.tips') + '</span><time class="text-ink-muted" datetime="' + post.date + '">' + Fmt.date(post.date) + '</time></p>' +
          '<h1 class="mt-3 text-[28px] md:text-[36px] font-extrabold leading-tight">' + Fmt.esc(title) + '</h1>' +
          '<div class="article mt-6">' + (I18n.lang === 'en' && post.html_en ? post.html_en : post.html || body(post.body)) + '</div>' +
          '<div class="mt-10 rounded-3xl bg-primary-soft polka p-6 md:p-8 flex flex-col sm:flex-row sm:items-center justify-between gap-4">' +
          '<p class="font-display font-bold text-[30px] text-primary-strong leading-tight pb-1">' + I18n.t('blog.cta') + '</p><a href="danh-sach-banh.html" class="btn btn-primary h-12 px-7 shrink-0">' + I18n.t('cta.order') + '</a></div></div>';
        /* liên kết ngoài mở tab mới */
        $all('#post .article a').forEach(function (a) { if (a.hostname && a.hostname !== location.hostname) { a.target = '_blank'; a.rel = 'noopener'; } });
        var rel = DB.get('posts').filter(function (p) { return p.status === 'published' && p.id !== post.id && p.category === post.category; }).slice(0, 3);
        if (rel.length < 3) rel = rel.concat(DB.get('posts').filter(function (p) { return p.status === 'published' && p.id !== post.id && rel.indexOf(p) === -1; })).slice(0, 3);
        $('#related').innerHTML = '<h2 id="rel-title" class="font-display font-bold text-[28px] md:text-[36px] leading-tight mb-6">' + I18n.t('blog.related') + '</h2>' +
          '<div class="grid md:grid-cols-3 gap-6">' + rel.map(function (p) {
            return '<a href="chi-tiet-bai-viet.html?slug=' + p.slug + '" class="cake-card group flex md:block gap-4 rounded-3xl focus-ring"><div class="overflow-hidden rounded-2xl bg-beige w-28 md:w-auto shrink-0 aspect-square md:aspect-[16/10]"><img src="' + p.cover + '" alt="" loading="lazy" class="cake-img w-full h-full object-cover"></div>' +
              '<div class="md:pt-3"><time class="text-sm text-ink-muted">' + Fmt.date(p.date) + '</time><h3 class="font-extrabold leading-snug line-clamp-2 group-hover:text-primary-strong">' + Fmt.esc(I18n.pick(p, 'title')) + '</h3></div></a>';
          }).join('') + '</div>';
      }
      render();
      document.addEventListener('langchange', render);
    });
  </script>
</body>
</html>
