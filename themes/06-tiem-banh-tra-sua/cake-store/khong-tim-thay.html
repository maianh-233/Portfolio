<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Không tìm thấy trang | Tiệm Bánh Kem</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/app.js"></script>
</head>
<!-- SCR-012 Không tìm thấy (404). Biến thể: ?type=cake (E-DM-02), ?type=post (E-GT-02) -->
<body data-screen="SCR-012" data-layout="public" data-nav="" class="bg-cream text-ink font-sans antialiased">
  <div id="app-header"></div>

  <main id="main" class="mx-auto max-w-shell px-4 md:px-6 lg:px-8 pt-14 md:pt-20">
    <div class="text-center max-w-xl mx-auto">
      <div class="mx-auto relative w-28 h-28">
        <div class="absolute inset-0 rounded-full bg-primary-soft polka"></div>
        <i class="ph-fill ph-cake absolute inset-0 grid place-items-center text-6xl text-primary-strong rotate-[-14deg]" aria-hidden="true"></i>
        <i class="ph-fill ph-question absolute -right-1 -top-1 grid place-items-center w-10 h-10 rounded-full bg-butter text-butter-strong text-xl" aria-hidden="true"></i>
      </div>
      <h1 id="nf-title" class="mt-6 font-display font-bold text-[34px] md:text-[44px] leading-[1.15] text-primary-strong pb-1"></h1>
      <p id="nf-text" class="mt-3 text-[17px] text-ink-muted"></p>
      <div id="nf-actions" class="mt-7 flex flex-col sm:flex-row gap-3 justify-center"></div>
    </div>
    <section id="suggest" class="hidden mt-16" aria-labelledby="sg-title">
      <h2 id="sg-title" class="font-display font-bold text-[28px] md:text-[36px] leading-tight mb-6">Có thể bạn sẽ thích</h2>
      <div id="sg-list" class="rail rail-desktop-grid"></div>
    </section>
  </main>

  <div id="app-footer"></div>

  <script>
    App.onReady(function () {
      var type = App.param('type');
      function render() {
        var en = I18n.lang === 'en';
        if (type === 'cake') {
          $('#nf-title').textContent = en ? 'This cake is no longer available.' : 'Bánh này hiện không còn bán.';
          $('#nf-text').textContent = en ? 'Have a look at these instead.' : 'Bạn xem thử mấy mẫu bánh khác của tiệm nha.';
          $('#nf-actions').innerHTML = '<a href="danh-sach-banh.html" class="btn btn-primary h-12 px-7">' + I18n.t('cta.viewCakes') + '</a><a href="index.html" class="btn btn-secondary h-12 px-7">' + I18n.t('cta.home') + '</a>';
          $('#suggest').classList.remove('hidden');
          $('#sg-list').innerHTML = Cakes.visible().slice().sort(function (a, b) { return b.sold - a.sold; }).slice(0, 4).map(function (c) { return UI.cakeCard(c); }).join('');
        } else if (type === 'post') {
          $('#nf-title').textContent = en ? 'Post not found.' : 'Không tìm thấy bài viết.';
          $('#nf-text').textContent = en ? 'The post may have been removed.' : 'Bài viết có thể đã được gỡ hoặc chưa đăng.';
          $('#nf-actions').innerHTML = '<a href="bai-viet.html" class="btn btn-primary h-12 px-7">' + (en ? 'Back to blog' : 'Về danh sách bài viết') + '</a>';
        } else {
          $('#nf-title').textContent = I18n.t('nf.title');
          $('#nf-text').textContent = I18n.t('nf.text');
          $('#nf-actions').innerHTML = '<a href="index.html" class="btn btn-primary h-12 px-7">' + I18n.t('cta.home') + '</a><a href="danh-sach-banh.html" class="btn btn-secondary h-12 px-7">' + I18n.t('cta.viewCakes') + '</a>';
        }
      }
      render();
      document.addEventListener('langchange', render);
    });
  </script>
</body>
</html>
