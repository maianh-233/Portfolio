<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tài khoản | Quản lý tiệm</title>
  <meta name="robots" content="noindex">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/app.js"></script>
</head>
<!-- SCR-022 Tài khoản và phân quyền: FR-043 (đổi mật khẩu), FR-044. Nhân viên chỉ thấy "Tài khoản của tôi". -->
<body data-screen="SCR-022" data-layout="admin" data-nav="accounts" data-title="Tài khoản" class="admin bg-[#FFFBF6] text-ink font-sans antialiased">
  <div id="app-header"></div>

  <main id="main" class="lg:pl-60 pb-24 lg:pb-12">
    <div class="mx-auto max-w-admin px-4 md:px-6 lg:px-8 pt-4 lg:pt-8">
      <div class="flex items-center justify-between gap-3">
        <h1 class="text-[20px] lg:text-2xl font-extrabold">Tài khoản</h1>
        <button type="button" id="add" class="hidden btn btn-primary h-10 px-4 text-sm"><i class="ph ph-user-plus" aria-hidden="true"></i>Thêm tài khoản</button>
      </div>
      <div id="accounts" class="mt-4"></div>

      <section class="mt-6 rounded-2xl bg-white border border-beige p-4 md:p-6 max-w-3xl" aria-labelledby="me-h">
        <h2 id="me-h" class="font-extrabold">Tài khoản của tôi</h2>
        <p id="me-info" class="text-sm text-ink-muted mt-0.5"></p>
        <form id="pw-form" class="mt-4 grid md:grid-cols-3 gap-4" novalidate>
          <div class="field"><label class="field-label" for="cur">Mật khẩu hiện tại</label><input id="cur" type="password" autocomplete="current-password" class="field-input"></div>
          <div class="field"><label class="field-label" for="new">Mật khẩu mới</label><input id="new" type="password" autocomplete="new-password" class="field-input" aria-describedby="new-help"><p id="new-help" class="field-help">Tối thiểu 8 ký tự, gồm chữ và số.</p></div>
          <div class="field"><label class="field-label" for="cf">Nhập lại</label><input id="cf" type="password" autocomplete="new-password" class="field-input"></div>
          <div class="md:col-span-3"><button type="submit" class="btn btn-primary h-11 px-6">Đổi mật khẩu</button></div>
        </form>
      </section>
    </div>
  </main>

  <script>
    App.onReady(function () {
      var me = Auth.current(), owner = me.role === 'owner';
      $('#me-info').textContent = me.name + ' · ' + me.email + ' · ' + (owner ? 'Chủ tiệm' : 'Nhân viên');
      var accs = DB.get('accounts');
      function owners() { return accs.filter(function (a) { return a.role === 'owner' && a.status === 'active'; }).length; }
      function badge(a) { return a.status === 'active' ? '<span class="badge bg-mint text-mint-strong">Hoạt động</span>' : '<span class="badge bg-stone2 text-stone2-strong">Đã khóa</span>'; }
      function lockBtn(a) {
        var last = a.role === 'owner' && a.status === 'active' && owners() <= 1;
        if (a.id === me.id || last) return '<span class="text-xs text-ink-muted">' + (last ? 'Không khóa được chủ tiệm cuối cùng' : 'Tài khoản đang dùng') + '</span>';
        return '<button type="button" class="btn ' + (a.status === 'active' ? 'btn-danger-outline' : 'btn-secondary') + ' h-9 px-4 text-sm" data-lock="' + a.id + '">' + (a.status === 'active' ? 'Khóa' : 'Mở khóa') + '</button>';
      }
      function priceCtl(a) {
        if (a.role === 'owner') return '<span class="inline-flex items-center gap-1 text-sm font-semibold text-mint-strong"><i class="ph-bold ph-check" aria-hidden="true"></i>Có (cố định)</span>';
        return '<label class="switch"><input type="checkbox" data-price="' + a.id + '"' + (a.canEditPrice ? ' checked' : '') + ' aria-label="Quyền sửa giá của ' + Fmt.esc(a.name) + '"><span></span></label>';
      }
      function render() {
        if (!owner) { $('#accounts').innerHTML = ''; return; }
        $('#add').classList.remove('hidden');
        $('#accounts').innerHTML = '<div class="hidden md:block rounded-2xl bg-white border border-beige overflow-hidden"><table class="admin-table"><thead><tr><th>Họ tên</th><th>Email</th><th>Vai trò</th><th>Sửa giá</th><th>Trạng thái</th><th></th></tr></thead><tbody>' +
          accs.map(function (a) { return '<tr data-id="' + a.id + '" tabindex="0"><td class="font-bold">' + Fmt.esc(a.name) + '</td><td>' + Fmt.esc(a.email) + '</td><td>' + (a.role === 'owner' ? 'Chủ tiệm' : 'Nhân viên') + '</td><td class="ctl">' + priceCtl(a) + '</td><td>' + badge(a) + '</td><td class="ctl text-right">' + lockBtn(a) + '</td></tr>'; }).join('') +
          '</tbody></table></div><ul class="md:hidden space-y-2">' + accs.map(function (a) {
            return '<li class="rounded-2xl bg-white border border-beige p-4"><button type="button" data-id="' + a.id + '" class="w-full text-left"><span class="flex items-start justify-between gap-2"><span class="font-extrabold">' + Fmt.esc(a.name) + '</span>' + badge(a) + '</span><span class="block text-sm text-ink-muted">' + Fmt.esc(a.email) + ' · ' + (a.role === 'owner' ? 'Chủ tiệm' : 'Nhân viên') + '</span></button>' +
              '<div class="mt-3 pt-3 border-t border-beige flex items-center justify-between gap-2"><span class="flex items-center gap-2 text-sm font-semibold">Sửa giá ' + priceCtl(a) + '</span>' + lockBtn(a) + '</div></li>';
          }).join('') + '</ul>';
        $all('[data-id]').forEach(function (r) { r.onclick = function (e) { if (e.target.closest('.ctl')) return; edit(accs.filter(function (a) { return a.id === +r.dataset.id; })[0]); }; });
        $all('[data-price]').forEach(function (cb) { cb.onchange = function () { var a = accs.filter(function (x) { return x.id === +cb.dataset.price; })[0]; a.canEditPrice = cb.checked; DB.save('accounts'); Toast.show('Đã cập nhật quyền', 'success'); }; });
        $all('[data-lock]').forEach(function (b) {
          b.onclick = function () {
            var a = accs.filter(function (x) { return x.id === +b.dataset.lock; })[0], locking = a.status === 'active';
            Modal.confirm({ title: (locking ? 'Khóa' : 'Mở khóa') + ' tài khoản ' + Fmt.esc(a.name) + '?', message: locking ? 'Người này sẽ không đăng nhập được nữa cho tới khi mở khóa.' : 'Người này sẽ đăng nhập lại được.', confirmLabel: locking ? 'Khóa' : 'Mở khóa', danger: locking })
              .then(function (r) { if (r.ok) { a.status = locking ? 'locked' : 'active'; DB.save('accounts'); Toast.show(locking ? 'Đã khóa tài khoản' : 'Đã mở khóa tài khoản', 'success'); render(); } });
          };
        });
      }
      function strong(p) { return p.length >= 8 && /[a-zA-Z]/.test(p) && /\d/.test(p); }
      function edit(a) {
        var isNew = !a;
        Modal.open({ title: isNew ? 'Thêm tài khoản' : 'Sửa tài khoản',
          body: '<div class="space-y-4"><div class="field"><label class="field-label" for="a-name">Họ tên <span class="text-danger">*</span></label><input id="a-name" maxlength="100" class="field-input" value="' + Fmt.esc(a ? a.name : '') + '"></div>' +
            '<div class="field"><label class="field-label" for="a-email">Email <span class="text-danger">*</span></label><input id="a-email" type="email" class="field-input" value="' + Fmt.esc(a ? a.email : '') + '"' + (isNew ? '' : ' readonly') + '></div>' +
            '<div class="field"><label class="field-label" for="a-role">Vai trò <span class="text-danger">*</span></label><select id="a-role" class="field-input"><option value="staff">Nhân viên</option><option value="owner">Chủ tiệm</option></select></div>' +
            '<label class="flex items-center gap-3 font-semibold"><span class="switch"><input id="a-price" type="checkbox"' + (a && a.canEditPrice ? ' checked' : '') + '><span></span></span>Quyền sửa giá</label>' +
            (isNew ? '<div class="field"><label class="field-label" for="a-pw">Mật khẩu ban đầu <span class="text-danger">*</span></label><div class="flex gap-2"><input id="a-pw" type="text" class="field-input" autocomplete="off"><button type="button" id="gen" class="btn btn-secondary h-12 px-4 text-sm shrink-0">Tạo ngẫu nhiên</button></div><p class="field-help">Tối thiểu 8 ký tự, gồm chữ và số.</p></div>' : '') + '</div>',
          actions: [{ label: 'Đóng' }, { label: isNew ? 'Tạo tài khoản' : 'Lưu', variant: 'primary', onClick: function (c, el) {
            var n = $('#a-name', el), e = $('#a-email', el), pw = $('#a-pw', el), ok = true;
            if (!n.value.trim()) { FormUI.setError(n, 'Vui lòng nhập họ tên.'); ok = false; }
            if (isNew) {
              if (!FormUI.validEmail(e.value.trim())) { FormUI.setError(e, 'Email không hợp lệ.'); ok = false; }
              else if (accs.some(function (x) { return x.email.toLowerCase() === e.value.trim().toLowerCase(); })) { FormUI.setError(e, 'Email đã được dùng cho tài khoản khác.'); ok = false; } // E-TK-14
              if (!strong(pw.value)) { FormUI.setError(pw, 'Mật khẩu tối thiểu 8 ký tự, gồm chữ và số.'); ok = false; } // E-TK-16
            }
            var role = $('#a-role', el).value;
            if (!isNew && a.role === 'owner' && role !== 'owner' && owners() <= 1) { FormUI.setError($('#a-role', el), 'Cần giữ ít nhất 1 chủ tiệm.'); ok = false; }
            if (!ok) return false;
            if (isNew) { a = { id: Math.max.apply(null, accs.map(function (x) { return x.id; })) + 1, email: e.value.trim(), password: pw.value, status: 'active' }; accs.push(a); }
            a.name = n.value.trim(); a.role = role; a.canEditPrice = role === 'owner' || $('#a-price', el).checked;
            DB.save('accounts'); Toast.show(isNew ? 'Đã tạo tài khoản' : 'Đã lưu', 'success'); render();
          } }],
          onOpen: function (el) {
            $('#a-role', el).value = a ? a.role : 'staff';
            var g = $('#gen', el);
            if (g) g.onclick = function () { var s = 'abcdefghjkmnpqrstuvwxyz', d = '23456789', p = ''; for (var i = 0; i < 6; i++) p += s[Math.floor(Math.random() * s.length)]; p += d[Math.floor(Math.random() * 8)] + d[Math.floor(Math.random() * 8)]; $('#a-pw', el).value = p; };
          } });
      }
      $('#add').onclick = function () { edit(null); };
      $('#pw-form').addEventListener('submit', function (e) {
        e.preventDefault();
        var cur = $('#cur'), nw = $('#new'), cf = $('#cf'), ok = true;
        if (cur.value !== me.password) { FormUI.setError(cur, 'Mật khẩu hiện tại không đúng.'); ok = false; }
        if (!strong(nw.value)) { FormUI.setError(nw, 'Mật khẩu tối thiểu 8 ký tự, gồm chữ và số.'); ok = false; } // E-TK-16
        if (cf.value !== nw.value) { FormUI.setError(cf, 'Mật khẩu nhập lại không khớp.'); ok = false; }
        if (!ok) { FormUI.focusFirst(this); return; }
        me.password = nw.value; DB.save('accounts');
        this.reset(); Toast.show('Đã đổi mật khẩu', 'success');
      });
      render();
    });
  </script>
</body>
</html>
