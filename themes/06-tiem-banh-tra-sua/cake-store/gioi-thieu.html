<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Câu chuyện của tiệm | Tiệm Bánh Kem</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/app.js"></script>
</head>
<!-- SCR-002 Giới thiệu tiệm: FR-002, FR-006 -->
<body data-screen="SCR-002" data-layout="public" data-nav="about" class="bg-cream text-ink font-sans antialiased">
  <div id="app-header"></div>

  <main id="main">
    <!-- Câu chuyện: chữ trái, ảnh phải -->
    <section class="mx-auto max-w-shell px-4 md:px-6 lg:px-8 pt-10 md:pt-16 grid md:grid-cols-12 gap-8 md:gap-12 items-center">
      <div class="md:col-span-7 hero-in">
        <h1 class="font-display font-bold text-[34px] md:text-[44px] leading-[1.15] text-primary-strong pb-1" data-i18n="about.title">Câu chuyện của tiệm</h1>
        <div id="story" class="mt-5 space-y-4 text-[17px] leading-relaxed max-w-[62ch]"></div>
      </div>
      <div class="md:col-span-5">
        <img id="story-img" src="" alt="Chủ tiệm trong căn bếp làm bánh" class="w-full aspect-[4/5] object-cover rounded-3xl shadow-lift bg-beige md:rotate-[1.5deg]">
      </div>
    </section>

    <!-- Thư viện ảnh không gian (bấm để phóng to) -->
    <section class="mx-auto max-w-shell px-4 md:px-6 lg:px-8 mt-16 md:mt-24 reveal" aria-labelledby="gallery-title">
      <h2 id="gallery-title" class="font-display font-bold text-[28px] md:text-[36px] leading-tight mb-6" data-i18n="about.gallery">Góc nhỏ của tiệm</h2>
      <ul id="gallery" class="grid grid-cols-2 md:grid-cols-3 gap-3 md:gap-5 md:pb-8"></ul>
    </section>

    <!-- Khối kêu gọi -->
    <section class="mx-auto max-w-shell px-4 md:px-6 lg:px-8 mt-16 md:mt-24 reveal">
      <div class="relative overflow-hidden rounded-3xl bg-primary-soft px-6 py-10 md:px-12 md:py-12 flex flex-col md:flex-row md:items-center justify-between gap-6">
        <div class="polka absolute inset-0 opacity-70 pointer-events-none" aria-hidden="true"></div>
        <p class="relative font-display font-bold text-[30px] md:text-[40px] leading-tight text-primary-strong pb-1" data-i18n="about.cta">Thèm bánh rồi đúng không?</p>
        <a href="danh-sach-banh.html" class="relative btn btn-primary h-12 px-7 shrink-0" data-i18n="cta.order">Đặt bánh ngay</a>
      </div>
    </section>
  </main>

  <div id="app-footer"></div>

  <script>
    /* SCR-002: câu chuyện + thư viện ảnh (CMP-14 xem phóng to) */
    App.onReady(function () {
      var shop = MOCK.shop, gallery = DB.get('gallery');
      function render() {
        var paras = I18n.lang === 'en' ? shop.story_en : shop.story;
        $('#story').innerHTML = paras.map(function (p) { return '<p>' + Fmt.esc(p) + '</p>'; }).join('');
        $('#story-img').src = shop.storyImage;
        $('#gallery').innerHTML = gallery.map(function (g, i) {
          /* nhịp so le nhẹ: cột giữa đẩy xuống trên máy tính */
          var shift = (i % 3 === 1) ? ' md:translate-y-8' : '';
          return '<li class="' + shift + '"><button type="button" data-i="' + i + '" class="group block w-full overflow-hidden rounded-2xl bg-beige focus-ring" aria-label="Phóng to ảnh: ' + Fmt.esc(g.alt) + '">' +
            '<img src="' + g.src + '" alt="' + Fmt.esc(g.alt) + '" loading="lazy" class="cake-img w-full object-cover aspect-square" onerror="this.src=\'https://picsum.photos/seed/anh-mac-dinh/600/600\'"></button></li>';
        }).join('');
        $all('#gallery [data-i]').forEach(function (b) {
          b.onclick = function () { Lightbox.open(gallery, +b.getAttribute('data-i')); };
        });
      }
      render();
      document.addEventListener('langchange', render);
    });
  </script>
</body>
</html>
