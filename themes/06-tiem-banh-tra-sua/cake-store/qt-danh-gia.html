<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đánh giá | Quản lý tiệm</title>
  <meta name="robots" content="noindex">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/app.js"></script>
</head>
<!-- SCR-019 Quản lý đánh giá: FR-025. Không sửa nội dung, chỉ Ẩn / Hiện lại / Duyệt / Từ chối. -->
<body data-screen="SCR-019" data-layout="admin" data-nav="reviews" data-title="Đánh giá" class="admin bg-[#FFFBF6] text-ink font-sans antialiased">
  <div id="app-header"></div>

  <main id="main" class="lg:pl-60 pb-24 lg:pb-12">
    <div class="mx-auto max-w-admin px-4 md:px-6 lg:px-8 pt-4 lg:pt-8">
      <h1 class="text-[20px] lg:text-2xl font-extrabold">Đánh giá</h1>
      <div class="mt-4 rounded-2xl bg-white border border-beige p-3 md:p-4 grid grid-cols-2 md:grid-cols-3 gap-3">
        <div class="field"><label class="field-label text-sm" for="f-status">Trạng thái</label><select id="f-status" class="field-input"><option value="">Tất cả</option><option value="visible">Hiển thị</option><option value="pending">Chờ duyệt</option><option value="hidden">Đã ẩn</option></select></div>
        <div class="field"><label class="field-label text-sm" for="f-rating">Số sao</label><select id="f-rating" class="field-input"><option value="">Tất cả</option><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></div>
        <div class="field col-span-2 md:col-span-1"><label class="field-label text-sm" for="f-cake">Bánh</label><select id="f-cake" class="field-input"></select></div>
      </div>
      <div id="list" class="mt-4" aria-live="polite"></div>
    </div>
  </main>

  <script>
    App.onReady(function () {
      var ST = { visible: ['Hiển thị', 'bg-mint text-mint-strong'], pending: ['Chờ duyệt', 'bg-butter text-butter-strong'], hidden: ['Đã ẩn', 'bg-stone2 text-stone2-strong'] };
      var F = { status: '', rating: '', cake: '' };
      $('#f-cake').innerHTML = '<option value="">Tất cả bánh</option>' + Cakes.all().map(function (c) { return '<option value="' + c.id + '">' + Fmt.esc(c.name) + '</option>'; }).join('');
      /* Chờ duyệt lên đầu để xử lý trước */
      if (DB.get('reviews').some(function (r) { return r.status === 'pending'; })) { F.status = 'pending'; $('#f-status').value = 'pending'; }

      function act(r, to, title, msg, danger) {
        var go = function () { r.status = to; DB.save('reviews'); Toast.show(msg + '. Điểm trung bình của bánh đã được tính lại.', 'success'); render(); };
        if (!danger) { go(); return; }
        Modal.confirm({ title: title, message: 'Đánh giá ' + r.rating + ' sao của ' + Fmt.esc(r.name) + ' sẽ không hiện với khách.', confirmLabel: title.replace('?', ''), danger: true }).then(function (x) { if (x.ok) go(); });
      }
      function render(loading) {
        var box = $('#list');
        if (loading) { box.innerHTML = '<div class="space-y-3">' + Array(5).join('.').split('.').map(function () { return '<div class="skeleton h-28 rounded-2xl"></div>'; }).join('') + '</div>'; return; }
        var list = DB.get('reviews').filter(function (r) {
          return (!F.status || r.status === F.status) && (!F.rating || r.rating === +F.rating) && (!F.cake || r.cakeId === +F.cake);
        }).sort(function (a, b) { return a.date < b.date ? 1 : -1; });
        if (!list.length) { box.innerHTML = '<div class="rounded-2xl bg-white border border-beige">' + UI.empty({ icon: 'ph-star', title: DB.get('reviews').length ? 'Không có đánh giá phù hợp' : 'Chưa có đánh giá nào' }) + '</div>'; return; }
        box.innerHTML = '<p class="text-sm font-bold text-ink-muted mb-2">' + list.length + ' đánh giá</p><ul class="space-y-3">' + list.map(function (r) {
          var c = Cakes.byId(r.cakeId), st = ST[r.status];
          var btns = r.status === 'visible' ? '<button type="button" class="btn btn-danger-outline h-9 px-4 text-sm" data-act="hide" data-id="' + r.id + '">Ẩn</button>'
            : r.status === 'hidden' ? '<button type="button" class="btn btn-secondary h-9 px-4 text-sm" data-act="show" data-id="' + r.id + '">Hiện lại</button>'
            : '<button type="button" class="btn btn-primary h-9 px-4 text-sm" data-act="approve" data-id="' + r.id + '">Duyệt</button><button type="button" class="btn btn-danger-outline h-9 px-4 text-sm" data-act="reject" data-id="' + r.id + '">Từ chối</button>';
          return '<li class="rounded-2xl bg-white border border-beige p-4 ' + (r.status === 'pending' ? 'border-l-4 !border-l-[#F2C230]' : '') + '">' +
            '<div class="flex flex-wrap items-center gap-x-3 gap-y-1">' + UI.stars(r.rating, 'text-base') + '<span class="font-bold">' + Fmt.esc(c ? c.name : 'Bánh') + '</span><span class="text-sm text-ink-muted">' + Fmt.esc(r.name) + ' · ' + Fmt.date(r.date) + ' · Đơn ' + r.orderCode + '</span><span class="badge ' + st[1] + ' sm:ml-auto">' + st[0] + '</span></div>' +
            '<p class="mt-2 leading-relaxed">' + (r.content ? '“' + Fmt.esc(r.content) + '”' : '<span class="text-ink-muted">Khách không viết nội dung</span>') + '</p>' +
            (r.images.length ? '<div class="mt-2 flex gap-2">' + r.images.map(function (s) { return '<button type="button" class="rv-img w-16 h-16 rounded-lg overflow-hidden bg-beige" data-src="' + s + '" aria-label="Phóng to ảnh"><img src="' + s + '" alt="Ảnh khách gửi" class="w-full h-full object-cover"></button>'; }).join('') + '</div>' : '') +
            '<div class="mt-3 flex flex-wrap justify-end gap-2">' + btns + '</div></li>';
        }).join('') + '</ul>';
        $all('[data-act]', box).forEach(function (b) {
          var r = DB.get('reviews').filter(function (x) { return x.id === +b.dataset.id; })[0];
          b.onclick = {
            hide: function () { act(r, 'hidden', 'Ẩn đánh giá này?', 'Đã ẩn đánh giá', true); },
            show: function () { act(r, 'visible', '', 'Đã hiện lại đánh giá'); },
            approve: function () { act(r, 'visible', '', 'Đã duyệt đánh giá'); },
            reject: function () { act(r, 'hidden', 'Từ chối đánh giá này?', 'Đã từ chối đánh giá', true); }
          }[b.dataset.act];
        });
        $all('.rv-img', box).forEach(function (b) { b.onclick = function () { Lightbox.open([{ src: b.dataset.src, alt: 'Ảnh khách gửi' }], 0); }; });
      }
      ['status', 'rating', 'cake'].forEach(function (k) { $('#f-' + k).onchange = function () { F[k] = this.value; render(); }; });
      render(true);
      App.fakeLoad(function () { render(); }, 350);
    });
  </script>
</body>
</html>
