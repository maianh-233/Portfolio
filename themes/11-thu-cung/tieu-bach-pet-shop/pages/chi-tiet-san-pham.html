<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chi tiết sản phẩm · Tiểu Bạch Pet Shop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../assets/js/tailwind.tokens.js"></script>
  <link rel="stylesheet" href="../assets/css/tokens.css">
</head>
<body data-screen="SCR-PROD-002" data-module="PROD" class="bg-neutral-50 text-neutral-800">
  <div id="app"></div>
  <script src="../assets/js/icons.js"></script>
  <script src="../assets/js/permissions.js"></script>
  <script src="../assets/js/workflows.js"></script>
  <script src="../assets/js/mock-data/master.js"></script>
  <script src="../assets/js/mock-data/book.js"></script>
  <script src="../assets/js/mock-data/review.js"></script>
  <script src="../assets/js/mock-data/news.js"></script>
  <script src="../assets/js/demo-store.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
  /* SCR-PROD-002 Chi tiết sản phẩm: ProductGallery + VariantTiles (ô có ảnh nhỏ) + QuantityStepper + Thêm vào giỏ + Mô tả / Đánh giá + gợi ý.
   * ?id=<productId>&bien-the=<variantId>. Không có id → sản phẩm mẫu p1. Pate chay → chuyển sang SCR-PROD-003. */
  (function () {
    var U = Perm.url, esc = UI.esc, ic = UI.icon;
    var p = App.product(App.param('id') || 'p1');
    if (p && p.la_pate) { location.replace(App.productHref(p)); return; }
    var ok = p && p.trang_thai === 'DANG_BAN';
    var pet = ok ? App.petType(p.pet_type_ids[0]) : null, cat = ok ? App.category(p.category_id) : null;
    var bc = ok ? [['Sản phẩm', 'pages/san-pham.html'], [pet.ten, 'pages/san-pham.html?thu-cung=' + pet.id], [cat.ten, 'pages/san-pham.html?nhom=' + cat.id], [p.ten]] : [['Sản phẩm', 'pages/san-pham.html'], ['Không tìm thấy']];

    Layout.mount({ title: ok ? p.ten : 'Không tìm thấy sản phẩm', active: 'products', breadcrumb: bc }, function (main) {
      if (!ok) {
        main.insertAdjacentHTML('beforeend', '<div class="mx-auto max-w-content px-4 py-6 md:px-6 lg:px-8"><div class="rounded-xl border border-neutral-200 bg-white">' +
          UI.emptyState({ title: 'Ơ, Tiểu Bạch tìm mãi không thấy sản phẩm này', action: UI.button({ label: 'Xem sản phẩm khác', href: U('pages/san-pham.html') }) }) + '</div></div>');
        return;
      }
      var wanted = App.param('bien-the');
      var sel = p.variants.filter(function (v) { return v.id === wanted && App.inStock(v); })[0] || p.variants.filter(App.inStock)[0] || null;
      var allOut = !sel;
      var bigImg = function (v) { return v && v.anh ? v.anh.replace('/160/160/', '/800/800/') : null; };
      var canBuy = Perm.can('BOOK.CART.CREATE');

      main.insertAdjacentHTML('beforeend', '<div class="mx-auto max-w-content px-4 pb-6 pt-5 md:px-6 lg:px-8">' +
        '<div class="grid gap-6 md:grid-cols-2 lg:grid-cols-12 lg:gap-10">' +
        '<div class="lg:col-span-7 min-w-0" data-gallery>' + UI.skeletonBlock('aspect-square rounded-xl') + '</div>' +
        '<div class="lg:col-span-5 min-w-0"><div class="flex flex-col gap-4 lg:sticky lg:top-24" data-info>' + UI.skeleton(4) + '</div></div></div>' +
        '<div class="mt-10 hidden md:block rounded-xl border border-neutral-200 bg-white p-5 lg:p-6" data-tabs></div>' +
        '<div class="mt-8 flex flex-col gap-8 md:hidden"><section><h2 class="mb-3 text-xl font-extrabold">Mô tả</h2><div class="prose-post" data-desc-m></div></section><section id="danh-gia-m"><h2 class="mb-3 text-xl font-extrabold">Đánh giá (' + p.so_danh_gia + ')</h2><div data-rev-m></div></section></div>' +
        '</div><div data-suggest></div>');

      var gallery;
      function info() {
        var v = sel || p.variants[0];
        var low = sel && sel.ton_kho != null && sel.ton_kho > 0 && sel.ton_kho <= sel.nguong;
        var stock = allOut ? '<p class="text-sm font-bold text-danger-700">Hết hàng</p>' : low ? '<p class="text-sm font-bold text-warning-700">Chỉ còn ' + sel.ton_kho + ' sản phẩm</p>' : '<p class="text-sm font-bold text-success-700">Còn hàng</p>';
        var max = sel ? Math.min(99, sel.ton_kho == null ? 99 : sel.ton_kho) : 1;
        return '<div class="flex flex-wrap gap-1.5">' + App.petTags(p.pet_type_ids).map(function (t) { return UI.tag(t.label, t.tone); }).join('') + App.badges(p).map(function (b) { return UI.badge(b.text, b.tone); }).join('') + '</div>' +
          '<h1 class="text-2xl font-extrabold leading-tight text-neutral-800">' + esc(p.ten) + '</h1>' +
          (p.so_danh_gia ? '<a href="#danh-gia" data-to-reviews class="inline-flex w-fit items-center gap-2 rounded-md hover:underline">' + UI.ratingStars(p.sao, { size: 'sm', showValue: true }) + '<span class="text-sm text-neutral-600">(' + p.so_danh_gia + ' đánh giá)</span></a>' : '<p class="text-sm text-neutral-600">Chưa có đánh giá</p>') +
          '<p class="text-sm text-neutral-600">Thương hiệu: <span class="font-bold text-neutral-800">' + esc(p.thuong_hieu) + '</span></p>' +
          '<div data-price>' + UI.priceTag({ price: v.gia, oldPrice: v.gia_goc, size: 'lg' }) + '</div>' +
          '<div><p class="mb-2 text-sm font-bold text-neutral-800">Chọn loại / khối lượng <span class="text-danger-600">*</span></p><div data-tiles></div><p data-v-err class="mt-1 hidden text-xs font-bold text-danger-700"></p></div>' +
          stock +
          (canBuy ? '<div class="flex items-center gap-4"><span class="text-sm font-bold text-neutral-800">Số lượng</span>' + UI.quantityStepper({ value: 1, max: max, limitMsg: 'Chỉ còn ' + max + ' sản phẩm', attrs: { 'data-main-qty': '' } }) + '</div>' : '') +
          (allOut ? UI.button({ label: 'Hết hàng', size: 'lg', full: true, disabled: true, attrs: { 'data-permission': 'BOOK.CART.CREATE' } })
            : UI.button({ label: 'Thêm vào giỏ', icon: 'shopping-cart', size: 'lg', full: true, attrs: { 'data-add-main': '', 'data-permission': 'BOOK.CART.CREATE' } })) +
          (canBuy && App.cart.subtotal() < MOCK.settings.freeShip ? UI.freeShipProgress(App.cart.subtotal(), { threshold: MOCK.settings.freeShip }) : '');
      }
      function paintInfo() {
        var box = main.querySelector('[data-info]');
        box.innerHTML = info();
        UI.variantTiles(box.querySelector('[data-tiles]'), {
          variants: p.variants.map(function (v) { return { id: v.id, label: v.ten, price: v.gia, img: v.anh || p.anh[0], disabled: !App.inStock(v) }; }),
          value: sel ? sel.id : null,
          onChange: function (v) {
            sel = p.variants.filter(function (x) { return x.id === v.id; })[0];
            App.setParams({ 'bien-the': sel.id });
            paintInfo(); paintSticky();
            if (gallery && bigImg(sel)) gallery.setImages([bigImg(sel)].concat(p.anh));
          }
        });
      }
      function addToCart(btn) {
        if (!sel) { var e = main.querySelector('[data-v-err]'); e.textContent = 'Vui lòng chọn loại / khối lượng'; e.classList.remove('hidden'); return; }
        var qi = main.querySelector('[data-main-qty] [data-qty-input]');
        var q = qi ? parseInt(qi.value, 10) || 1 : 1;
        var err = App.cart.add({ productId: p.id, variantId: sel.id, qty: q });
        if (err) { UI.toast(err, 'error'); return; }
        UI.addToCartFeedback(btn, { message: 'Đã thêm ' + p.ten + ' (' + sel.ten + ') vào giỏ', viewHref: U('pages/gio-hang.html') });
        setTimeout(function () { paintInfo(); paintSticky(); }, 1300);
      }
      function paintSticky() {
        if (!canBuy || allOut) return;
        var v = sel || p.variants[0];
        UI.stickyBar('<div class="flex items-center gap-3"><div class="min-w-0 flex-1"><p class="truncate text-xs text-neutral-600">' + esc(v.ten) + '</p>' + UI.priceTag({ price: v.gia, oldPrice: v.gia_goc, size: 'md' }) + '</div>' +
          UI.button({ label: 'Thêm vào giỏ', icon: 'shopping-cart', attrs: { 'data-add-sticky': '' } }) + '</div>', { watch: main.querySelector('[data-add-main]') });
      }

      /* Đánh giá: RatingSummary + ReviewCard × 5 + "Xem thêm đánh giá"; lọc theo sao / có ảnh */
      function mountReviews(el) {
        var all = DemoStore.list('reviews').filter(function (r) { return r.product_id === p.id && r.state === 'VISIBLE'; }).sort(function (a, b) { return a.tao_luc < b.tao_luc ? 1 : -1; });
        if (!all.length && !p.so_danh_gia) { el.innerHTML = UI.emptyState({ size: 'sm', mood: 'happy', title: 'Chưa có đánh giá nào. Mua và trải nghiệm để là người đầu tiên đánh giá nhé!' }); return; }
        var filter = 'all', shown = 5;
        el.innerHTML = '<div data-sum></div><div class="mt-6 flex flex-col gap-3" data-list></div><div class="mt-4 flex justify-center" data-more></div>';
        UI.ratingSummary(el.querySelector('[data-sum]'), { avg: p.sao, count: p.so_danh_gia, dist: p.dist, photoCount: all.filter(function (r) { return r.anh.length; }).length, onFilter: function (k) { filter = k; shown = 5; list(); } });
        function list() {
          var l = all.filter(function (r) { return filter === 'all' ? true : filter === 'photo' ? r.anh.length > 0 : r.so_sao === +filter; });
          el.querySelector('[data-list]').innerHTML = l.length ? l.slice(0, shown).map(function (r) { return UI.reviewCard({ name: App.maskName(r.ho_ten), stars: r.so_sao, date: r.tao_luc, text: r.noi_dung, photos: r.anh, variant: r.variant }); }).join('')
            : '<p class="rounded-lg bg-neutral-50 p-4 text-sm text-neutral-600">Chưa có đánh giá phù hợp bộ lọc.</p>';
          el.querySelector('[data-more]').innerHTML = l.length > shown ? UI.button({ label: 'Xem thêm đánh giá', variant: 'outline', attrs: { 'data-more-rv': '' } }) : '';
        }
        el.addEventListener('click', function (e) { if (e.target.closest('[data-more-rv]')) { shown += 5; list(); } });
        list();
      }

      setTimeout(function () {
        gallery = UI.productGallery(main.querySelector('[data-gallery]'), { images: (bigImg(sel) && App.param('bien-the') ? [bigImg(sel)] : []).concat(p.anh), alt: p.ten });
        paintInfo(); paintSticky();
        UI.tabs(main.querySelector('[data-tabs]'), { tabs: [
          { id: 'mo-ta', label: 'Mô tả', content: '<div class="prose-post max-w-3xl">' + p.mo_ta + '</div>' },
          { id: 'danh-gia', label: 'Đánh giá', count: p.so_danh_gia, content: function (panel) { panel.innerHTML = '<div class="max-w-4xl"></div>'; mountReviews(panel.firstChild); } }
        ] });
        main.querySelector('[data-desc-m]').innerHTML = p.mo_ta;
        mountReviews(main.querySelector('[data-rev-m]'));

        var sug = App.products().filter(function (x) { return x.id !== p.id && !x.la_pate && (x.category_id === p.category_id || x.pet_type_ids.some(function (t) { return p.pet_type_ids.indexOf(t) >= 0; })); })
          .sort(function (a, b) { return (b.category_id === p.category_id) - (a.category_id === p.category_id) || b.sold30 - a.sold30; }).slice(0, 4);
        if (sug.length) main.querySelector('[data-suggest]').innerHTML = UI.section({ title: 'Có thể Boss cũng thích', body: '<div class="grid grid-cols-2 gap-3 md:gap-4 lg:grid-cols-4">' + sug.map(App.productCard).join('') + '</div>' });
        UI.reveal(main);
      }, 400);

      // StickyActionBar nằm ngoài main (gắn vào body) nên nghe ở document
      document.addEventListener('click', function (e) {
        var a = e.target.closest('[data-add-main]'); if (a) { addToCart(a); return; }
        var s = e.target.closest('[data-add-sticky]'); if (s) { addToCart(s); return; }
        if (e.target.closest('[data-to-reviews]')) {
          e.preventDefault();
          var desk = window.innerWidth >= 768, t = desk ? main.querySelector('[data-tabs]') : document.getElementById('danh-gia-m');
          if (desk) { var b = t.querySelector('[data-tab="danh-gia"]'); if (b) b.click(); }
          t.scrollIntoView({ behavior: UI.reducedMotion() ? 'auto' : 'smooth', block: 'start' });
        }
      });
    });
  })();
  </script>
</body>
</html>
