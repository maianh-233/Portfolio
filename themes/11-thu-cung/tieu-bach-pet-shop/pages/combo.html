<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chi tiết combo · Tiểu Bạch Pet Shop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../assets/js/tailwind.tokens.js"></script>
  <link rel="stylesheet" href="../assets/css/tokens.css">
</head>
<body data-screen="SCR-PROMO-001" data-module="PROMO" class="bg-neutral-50 text-neutral-800">
  <div id="app"></div>
  <script src="../assets/js/icons.js"></script>
  <script src="../assets/js/permissions.js"></script>
  <script src="../assets/js/workflows.js"></script>
  <script src="../assets/js/mock-data/master.js"></script>
  <script src="../assets/js/mock-data/book.js"></script>
  <script src="../assets/js/mock-data/review.js"></script>
  <script src="../assets/js/mock-data/news.js"></script>
  <script src="../assets/js/demo-store.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
  /* SCR-PROMO-001 Chi tiết combo: ảnh + giá combo / giá lẻ gạch ngang + LineItemsTable chỉ đọc + Thêm vào giỏ (1 dòng giỏ). ?id=<comboId> (mặc định cb1). */
  (function () {
    var U = Perm.url, esc = UI.esc;
    var c = DemoStore.get('combos', App.param('id') || 'cb1');
    var ok = c && c.trang_thai === 'BAT';
    Layout.mount({ title: ok ? c.ten : 'Combo không còn bán', active: 'products', breadcrumb: [['Combo tiết kiệm', 'pages/san-pham.html?nhom=combo'], [ok ? c.ten : 'Không tìm thấy']] }, function (main) {
      if (!ok) {
        main.insertAdjacentHTML('beforeend', '<div class="mx-auto max-w-content px-4 py-6 md:px-6 lg:px-8"><div class="rounded-xl border border-neutral-200 bg-white">' +
          UI.emptyState({ title: 'Combo này hiện không còn bán', action: UI.button({ label: 'Xem combo khác', href: U('pages/san-pham.html?nhom=combo') }) }) + '</div></div>');
        return;
      }
      var vm = App.comboVM(c), items = App.comboItems(c), max = App.comboMax(c), canBuy = Perm.can('BOOK.CART.CREATE');
      main.insertAdjacentHTML('beforeend', '<div class="mx-auto max-w-content px-4 pb-6 pt-5 md:px-6 lg:px-8"><div class="grid gap-6 md:grid-cols-2 lg:grid-cols-12 lg:gap-10">' +
        '<div class="lg:col-span-7 min-w-0" data-gallery>' + UI.skeletonBlock('aspect-video rounded-xl') + '</div>' +
        '<div class="lg:col-span-5 min-w-0 flex flex-col gap-4" data-info>' + UI.skeleton(3) + '</div></div>' +
        (c.mo_ta ? '<section class="mt-10 rounded-xl border border-neutral-200 bg-white p-5 lg:p-6"><h2 class="mb-2 text-xl font-extrabold text-neutral-800">Mô tả combo</h2><p class="max-w-prose text-base text-neutral-700">' + esc(c.mo_ta) + '</p></section>' : '') +
        '</div><div data-more></div>');

      setTimeout(function () {
        UI.productGallery(main.querySelector('[data-gallery]'), { images: [c.anh].concat(items.slice(0, 3).map(function (i) { return i.p.anh[0]; })), alt: c.ten });
        var info = main.querySelector('[data-info]');
        info.innerHTML = '<div class="flex flex-wrap gap-1.5">' + (vm.out ? UI.badge('Hết hàng', 'dark') : '') + (vm.save > 0 ? UI.badge('Tiết kiệm ' + UI.fmt.money(vm.save), 'success') : '') + '</div>' +
          '<h1 class="text-2xl font-extrabold leading-tight text-neutral-800">' + esc(c.ten) + '</h1>' +
          UI.priceTag({ price: c.gia_combo, oldPrice: vm.retail, size: 'lg' }) +
          '<div><p class="mb-2 text-sm font-bold text-neutral-800">Combo gồm:</p><div data-items></div></div>' +
          (vm.out ? UI.button({ label: 'Hết hàng', size: 'lg', full: true, disabled: true, attrs: { 'data-permission': 'BOOK.CART.CREATE' } })
            : (canBuy ? '<div class="flex items-center gap-3">' + UI.quantityStepper({ value: 1, max: Math.min(99, max), limitMsg: 'Chỉ còn ' + max + ' sản phẩm', attrs: { 'data-cqty': '' } }) +
              UI.button({ label: 'Thêm vào giỏ', icon: 'shopping-cart', size: 'lg', cls: 'flex-1', attrs: { 'data-add-main': '', 'data-permission': 'BOOK.CART.CREATE' } }) + '</div>' : ''));
        UI.lineItems(info.querySelector('[data-items]'), {
          rows: items.map(function (i) { return { id: i.v.id, p: i.p, v: i.v, qty: i.qty }; }),
          columns: [
            { key: 'img', label: 'Ảnh', type: 'custom', width: 'w-14', render: function (r) { return '<a href="' + App.productHref(r.p, r.v.id) + '" class="block size-12 overflow-hidden rounded-md bg-neutral-100">' + UI.img({ src: r.v.anh || r.p.anh[0], alt: r.p.ten }) + '</a>'; } },
            { key: 'name', label: 'Sản phẩm', type: 'custom', render: function (r) { return '<a href="' + App.productHref(r.p, r.v.id) + '" class="font-bold text-neutral-800 hover:text-primary-700 line-clamp-2">' + esc(r.p.ten) + '</a><span class="text-xs text-neutral-600">' + esc(r.v.ten) + '</span>'; } },
            { key: 'qty', label: 'Số lượng', type: 'custom', align: 'right', render: function (r) { return '<span class="font-bold">× ' + r.qty + '</span>'; } },
            { key: 'retail', label: 'Giá lẻ', type: 'custom', align: 'right', render: function (r) { return '<span class="text-neutral-500 tabular-nums">' + UI.fmt.money(r.v.gia * r.qty) + '</span>'; } }
          ]
        });
        if (canBuy && !vm.out) UI.stickyBar('<div class="flex items-center gap-3"><div class="flex-1">' + UI.priceTag({ price: c.gia_combo, oldPrice: vm.retail, size: 'md' }) + '</div>' + UI.button({ label: 'Thêm vào giỏ', icon: 'shopping-cart', attrs: { 'data-add-sticky': '' } }) + '</div>', { watch: info.querySelector('[data-add-main]') });
        var others = App.combos().filter(function (x) { return x.id !== c.id; }).slice(0, 3);
        if (others.length) main.querySelector('[data-more]').innerHTML = UI.section({ title: 'Combo khác', body: '<div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">' + others.map(function (x) { return UI.comboCard(App.comboVM(x)); }).join('') + '</div>' });
      }, 400);

      document.addEventListener('click', function (e) {
        var b = e.target.closest('[data-add-main],[data-add-sticky]'); if (!b) return;
        var qi = main.querySelector('[data-cqty] [data-qty-input]');
        var err = App.cart.add({ comboId: c.id, qty: qi ? parseInt(qi.value, 10) || 1 : 1 });
        if (err) { UI.toast(err, 'error'); return; }
        UI.addToCartFeedback(b, { message: 'Đã thêm combo vào giỏ', viewHref: U('pages/gio-hang.html') });
      });
    });
  })();
  </script>
</body>
</html>
