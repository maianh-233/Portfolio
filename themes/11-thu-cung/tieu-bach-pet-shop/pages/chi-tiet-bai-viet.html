<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chi tiết bài viết · Tiểu Bạch Pet Shop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../assets/js/tailwind.tokens.js"></script>
  <link rel="stylesheet" href="../assets/css/tokens.css">
</head>
<body data-screen="SCR-NEWS-002" data-module="NEWS" class="bg-neutral-50 text-neutral-800">
  <div id="app"></div>
  <script src="../assets/js/icons.js"></script>
  <script src="../assets/js/permissions.js"></script>
  <script src="../assets/js/workflows.js"></script>
  <script src="../assets/js/mock-data/master.js"></script>
  <script src="../assets/js/mock-data/book.js"></script>
  <script src="../assets/js/mock-data/review.js"></script>
  <script src="../assets/js/mock-data/news.js"></script>
  <script src="../assets/js/demo-store.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
  /* SCR-NEWS-002 Chi tiết bài viết: đầu bài + ảnh bìa + nội dung (prose-post) + chia sẻ + sản phẩm liên quan + CTA pate chay + bài liên quan. ?id=<slug> */
  (function () {
    var U = Perm.url, esc = UI.esc;
    var p = DemoStore.get('posts', App.param('id') || 'cach-chon-hat-cho-meo-con');
    var ok = p && p.state === 'PUBLISHED';
    Layout.mount({ title: ok ? p.tieu_de : 'Bài viết không tồn tại', breadcrumb: ok ? [['Bài viết', 'pages/bai-viet.html'], [p.chuyen_muc, 'pages/bai-viet.html?chuyen-muc=' + encodeURIComponent(p.chuyen_muc)]] : [['Bài viết', 'pages/bai-viet.html']] }, function (main) {
      if (!ok) { main.insertAdjacentHTML('beforeend', '<div class="mx-auto max-w-content px-4 py-6 md:px-6 lg:px-8"><div class="rounded-xl border border-neutral-200 bg-white">' + UI.emptyState({ title: 'Bài viết không tồn tại', action: UI.button({ label: 'Về danh sách bài', href: U('pages/bai-viet.html') }) }) + '</div></div>'); return; }
      var url = location.href.split('#')[0];
      var share = '<div class="flex items-center gap-2">' +
        UI.iconButton({ icon: 'facebook', label: 'Chia sẻ lên Facebook', variant: 'outline', href: 'https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(url), attrs: { target: '_blank', rel: 'noopener' } }) +
        UI.iconButton({ icon: 'zalo', label: 'Chia sẻ qua Zalo', variant: 'outline', href: 'https://zalo.me/share?url=' + encodeURIComponent(url), attrs: { target: '_blank', rel: 'noopener' } }) +
        UI.iconButton({ icon: 'link', label: 'Sao chép liên kết', variant: 'outline', attrs: { 'data-copy': url, 'data-copy-msg': 'Đã sao chép liên kết' } }) + '</div>';
      var pate = App.products().filter(function (x) { return x.la_pate; })[0];
      var cta = pate ? UI.ctaSection({ tone: 'mint', title: 'Pate chay tự làm', text: 'Đặt trước, giao sau khoảng 7 ngày', actions: UI.button({ label: 'Xem pate chay', href: App.productHref(pate), full: true, cls: 'sm:w-auto' }) }) : '';

      main.insertAdjacentHTML('beforeend', '<article class="mx-auto max-w-content px-4 pb-6 pt-5 md:px-6 lg:px-8" data-art>' + UI.skeleton(2) + UI.skeletonBlock('mt-4 aspect-video rounded-2xl') + UI.skeleton(6, 'mt-6') + '</article><div data-related></div>');
      setTimeout(function () {
        var prods = (p.san_pham_lien_quan || []).map(App.product).filter(function (x) { return x && x.trang_thai === 'DANG_BAN'; });
        main.querySelector('[data-art]').innerHTML =
          '<header class="mx-auto max-w-3xl"><div class="flex flex-wrap items-center gap-2 text-sm text-neutral-600">' + UI.tag(p.chuyen_muc, 'secondary') + '<span>' + UI.fmt.date(p.ngay_dang) + '</span><span aria-hidden="true">·</span><span>' + p.phut_doc + ' phút đọc</span></div>' +
          '<h1 class="mt-3 text-3xl font-extrabold leading-tight text-neutral-800 text-balance">' + esc(p.tieu_de) + '</h1><div class="mt-4 lg:hidden">' + share + '</div></header>' +
          '<div class="mx-auto mt-6 max-w-5xl aspect-video overflow-hidden rounded-2xl bg-primary-100">' + UI.img({ src: p.anh_bia, alt: p.tieu_de, eager: true }) + '</div>' +
          '<div class="mx-auto mt-8 grid max-w-5xl gap-8 lg:grid-cols-12"><div class="min-w-0 lg:col-span-8"><div class="prose-post mx-auto max-w-3xl overflow-x-auto" data-body>' + p.noi_dung + '</div>' +
          (prods.length ? '<section class="mt-10"><h2 class="mb-4 text-xl font-extrabold text-neutral-800">Sản phẩm nhắc trong bài</h2><div class="-mx-4 flex snap-x gap-3 overflow-x-auto px-4 pb-2 no-scrollbar md:mx-0 md:grid md:grid-cols-3 md:overflow-visible md:px-0">' + prods.slice(0, 3).map(function (x) { return '<div class="w-1/2 shrink-0 snap-start md:w-auto">' + App.productCard(x) + '</div>'; }).join('') + '</div></section>' : '') +
          '<div class="mt-8 lg:hidden">' + cta + '</div></div>' +
          '<aside class="hidden lg:col-span-4 lg:block"><div class="sticky top-24 flex flex-col gap-4">' + UI.card({ title: 'Chia sẻ bài viết', body: share }) + cta + '</div></aside></div>';
        // Ảnh trong bài bấm phóng to
        main.querySelectorAll('[data-body] img').forEach(function (img, i, all) { img.classList.add('cursor-zoom-in'); img.addEventListener('click', function () { UI.lightbox(Array.prototype.map.call(all, function (x) { return x.src; }), i); }); });
        var rel = DemoStore.list('posts').filter(function (x) { return x.state === 'PUBLISHED' && x.id !== p.id && x.chuyen_muc === p.chuyen_muc; }).sort(function (a, b) { return a.ngay_dang < b.ngay_dang ? 1 : -1; }).slice(0, 3);
        if (rel.length) main.querySelector('[data-related]').innerHTML = UI.section({ title: 'Bài liên quan', link: { label: 'Xem tất cả', href: U('pages/bai-viet.html') }, body: '<div class="grid gap-4 md:grid-cols-3">' + rel.map(function (x) { return UI.postCard({ href: U('pages/chi-tiet-bai-viet.html?id=' + x.slug), title: x.tieu_de, img: x.anh_bia, category: x.chuyen_muc, summary: x.tom_tat, date: x.ngay_dang, readMin: x.phut_doc }); }).join('') + '</div>' });
        UI.reveal(main);
      }, 400);
    });
  })();
  </script>
</body>
</html>
