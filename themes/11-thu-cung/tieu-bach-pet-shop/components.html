    form.addEventListener('submit', function (e) { e.preventDefault(); if (UI.validate(form, rules)) UI.toast('Form hợp lệ', 'success'); });
    document.addEventListener('click', function (e) {
      var t = e.target;
      if (t.closest('[data-demo-clear]')) { Object.keys(rules).forEach(function (k) { UI.setError(form, k, ''); }); $('[data-form-summary]').innerHTML = ''; }
      var to = t.closest('[data-demo-toast]'); if (to) UI.toast(to.getAttribute('data-demo-toast') === 'error' ? 'Có lỗi xảy ra, vui lòng thử lại sau.' : 'Đã thêm vào giỏ', to.getAttribute('data-demo-toast'), { action: { label: 'Xem giỏ', onClick: function () {} } });
      if (t.closest('[data-demo-modal]')) UI.modal({ title: 'Modal md', body: '<p>Nội dung modal. Esc để đóng, Tab không thoát khỏi hộp.</p>' + UI.field({ name: 'x', label: 'Trường thử' }), actions: [{ label: 'Hủy', variant: 'ghost' }, { label: 'Lưu' }] });
      var dr = t.closest('[data-demo-drawer]'); if (dr) UI.drawer({ title: 'Drawer', side: dr.getAttribute('data-demo-drawer'), body: '<p>Form trang quản lý / bộ lọc mobile.</p>', actions: [{ label: 'Đóng', variant: 'ghost' }, { label: 'Áp dụng' }] });
      if (t.closest('[data-demo-confirm]')) UI.confirm({ title: 'Hủy đơn DH-2026-00012?', message: 'Thao tác không hoàn tác được.', danger: true, confirmLabel: 'Hủy đơn', reason: { label: 'Lý do hủy', required: true, options: ['Đổi ý, không mua nữa', 'Đặt nhầm sản phẩm', 'Khác'], errorMsg: 'Vui lòng chọn lý do hủy' } }).then(function (r) { if (r) UI.toast('Đã hủy: ' + r.note, 'success'); });
      var dd = t.closest('[data-demo-dd]'); if (dd) UI.dropdown(dd, [{ label: 'Xem chi tiết', icon: 'eye', onClick: function () {} }, { label: 'Sửa', icon: 'pencil', onClick: function () {} }, { divider: true }, { label: 'Xóa', icon: 'trash-2', danger: true, onClick: function () {} }]);
      if (t.closest('[data-cart-open-demo]')) App.openCartDrawer();
    });
  })();
  </script>
</body>
